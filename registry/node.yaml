id: node.version
application: node
name: Version
description: Show the node version
command:
  executable: node
  arguments: [--version]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [node]
  files: [package.json]
tags: [node, version]
