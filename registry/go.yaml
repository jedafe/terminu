# Ref: .teos/conventions/adapter-manifest-format.md — builtin Go set.
id: go.version
application: go
name: Toolchain version
description: Show the Go toolchain version
command:
  executable: go
  arguments: [version]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [go]
  files: [go.mod, go.work]
tags: [go, version]
source: builtin
---
id: go.build
application: go
name: Build
description: Build all packages
command:
  executable: go
  arguments: [build, ./...]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [go]
  files: [go.mod]
tags: [go, build]
source: builtin
