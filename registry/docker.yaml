id: docker.container.logs
application: docker
name: View container logs
description: Stream logs for a container
parameters:
  - name: container
    type: resource
    resource: docker.container
    required: true
    flag: null
    description: Container name or id
command:
  executable: docker
  arguments: [logs, "-f", "{container.id}"]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [docker]
  files: [Dockerfile, docker-compose.yml, docker-compose.yaml, compose.yml, compose.yaml]
tags: [docker, logs, ops]
source: builtin
---
id: docker.container.exec
application: docker
name: Shell into container
description: Open an interactive shell in a running container
parameters:
  - name: container
    type: resource
    resource: docker.container
    required: true
    flag: null
  - name: shell
    type: enum
    options: ["/bin/sh", "/bin/bash"]
    required: true
    flag: null
    default: "/bin/sh"
command:
  executable: docker
  arguments: [exec, -it, "{container.id}", "{shell}"]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [docker]
  files: [Dockerfile, docker-compose.yml, docker-compose.yaml, compose.yml, compose.yaml]
tags: [docker, exec, shell]
source: builtin
