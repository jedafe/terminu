# Ref: .teos/conventions/adapter-manifest-format.md — aws set.
id: aws.identity
application: aws
name: Who am I
description: Show the caller's AWS identity
command:
  executable: aws
  arguments: [sts, get-caller-identity]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [aws]
  files: []
tags: [aws, sts, identity]
source: builtin
