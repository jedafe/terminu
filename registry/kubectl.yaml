# Ref: .teos/conventions/adapter-manifest-format.md — kubectl set.
id: k8s.contexts
application: kubectl
name: List contexts
description: Show configured kubeconfig contexts
command:
  executable: kubectl
  arguments: [config, get-contexts]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [kubectl]
  files: []
tags: [k8s, kubectl, contexts]
source: builtin
