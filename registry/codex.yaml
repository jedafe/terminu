---
id: codex.version
application: codex
name: Version
description: Show the CLI version
command:
  executable: codex
  arguments: [--version]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [codex]
  files: [AGENTS.md]
tags: [ai, codex, version]
source: builtin
