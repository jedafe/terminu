---
id: k8s.portforward
application: kubectl
name: Port-forward pod
description: Forward local port to a pod
parameters:
  - name: pod
    type: resource
    resource: k8s.pod
    required: true
    flag: null
  - name: ports
    type: string
    required: true
    flag: null
    description: local:remote (e.g. 8080:80)
command:
  executable: kubectl
  arguments: [port-forward, "{pod.id}", "{ports}"]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [kubectl]
  files: []
tags: [k8s, kubectl, port-forward]
source: builtin
