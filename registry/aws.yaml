---
id: aws.s3.ls.bucket
application: aws
name: List bucket objects
description: List objects under a bucket/prefix
parameters:
  - name: bucket
    type: string
    required: true
    flag: null
    description: s3://bucket or bucket/prefix
command:
  executable: aws
  arguments: [s3, ls, "{bucket}"]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [aws]
  files: []
tags: [aws, s3, list]
source: builtin
---
id: aws.s3.cp
application: aws
name: Copy to S3
description: Upload a local file to S3
parameters:
  - name: source
    type: string
    required: true
    flag: null
    description: Local file path
  - name: dest
    type: string
    required: true
    flag: null
    description: s3://bucket/key
command:
  executable: aws
  arguments: [s3, cp, "{source}", "{dest}"]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [aws]
  files: []
tags: [aws, s3, cp, upload]
source: builtin
