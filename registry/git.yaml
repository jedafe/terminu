# Ref: .teos/conventions/adapter-manifest-format.md — builtin git set.
# Context keys on the .git dir in cwd or a running git process.
id: git.status
application: git
name: Status
description: Show working tree status
command:
  executable: git
  arguments: [status]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [git]
  files: [.git]
tags: [git, status, repo]
source: builtin
