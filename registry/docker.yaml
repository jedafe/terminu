# Ref: .teos/conventions/adapter-manifest-format.md — builtin docker set.
id: docker.ps
application: docker
name: Running containers
description: List running containers
command:
  executable: docker
  arguments: [ps]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [docker]
  files: [Dockerfile, docker-compose.yml, docker-compose.yaml, compose.yml, compose.yaml]
tags: [docker, ps, containers]
source: builtin
