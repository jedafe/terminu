# Ref: .teos/conventions/adapter-manifest-format.md — python set.
id: python.version
application: python
name: Version
description: Show the Python version
command:
  executable: python3
  arguments: [--version]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [python, python3]
  files: [requirements.txt, pyproject.toml, setup.py]
tags: [python, version]
source: builtin
---
id: python.venv.create
application: python
name: Create venv
description: Create a .venv virtual environment in cwd
command:
  executable: python3
  arguments: [-m, venv, .venv]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [python, python3]
  files: [requirements.txt, pyproject.toml]
tags: [python, venv]
source: builtin
---
id: python.pip.install
application: python
name: pip install requirements
description: Install requirements.txt
command:
  executable: python3
  arguments: [-m, pip, install, -r, requirements.txt]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [python, python3]
  files: [requirements.txt]
tags: [python, pip, install]
source: builtin
---
id: python.pip.freeze
application: python
name: pip freeze
description: List installed packages in requirements format
command:
  executable: python3
  arguments: [-m, pip, freeze]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [python, python3]
  files: [requirements.txt, pyproject.toml]
tags: [python, pip, freeze]
source: builtin
---
id: python.pytest
application: python
name: Run pytest
description: Run the project's pytest suite
command:
  executable: python3
  arguments: [-m, pytest, -x, -q]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [python, python3, pytest]
  files: [pyproject.toml, setup.py, requirements.txt, pytest.ini]
tags: [python, pytest, test]
source: builtin
---
id: python.unittest
application: python
name: Run unittest
description: Discover and run unittest tests
command:
  executable: python3
  arguments: [-m, unittest, discover, -v]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [python, python3]
  files: [setup.py, requirements.txt]
tags: [python, unittest, test]
source: builtin
