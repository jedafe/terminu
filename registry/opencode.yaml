# Ref: .teos/conventions/adapter-manifest-format.md — opencode set.
id: opencode.launch
application: opencode
name: Launch opencode
description: Start an interactive opencode session
command:
  executable: opencode
  arguments: []
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [opencode]
  files: [opencode.json, opencode.jsonc]
tags: [ai, opencode, launch]
source: builtin
---
id: opencode.run
application: opencode
name: Run prompt
description: Run a prompt non-interactively
parameters:
  - name: prompt
    type: string
    required: true
    flag: null
    description: Prompt text
command:
  executable: opencode
  arguments: [run, "{prompt}"]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [opencode]
  files: [opencode.json, opencode.jsonc]
tags: [ai, opencode, run]
source: builtin
