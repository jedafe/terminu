# Terminu glossary — terms that mean something specific here
term: definition
adapter: "per-CLI screen parser implementing the Adapter interface — matches process, classifies state, extracts prompts"
screen_model: "headless VT-emulated view of a session's terminal (grid+attrs+cursor+dirty regions); adapters read this, never bytes"
trigger_gate: "the event set that authorizes a detection pass — quiescence, bottom-region dirty, cursor-to-input, on-demand"
waiting_for_input: "agent state where the tool has stopped producing output and awaits user response; carries kind: permission|option|confirm|freetext|unknown"
needs_you: "the registry view surfacing sessions in waiting-for-input, ordered by confidence and time"
overlay_button: "UI affordance rendered from an extracted prompt option; a tap injects the option's keystroke into the PTY — human sends always"
key_bar: "on-screen keyboard strip (Esc/Ctrl/Alt/arrows/Tab/Fn) — the touch answer to keyboard-only TUIs"
reconnect_resync: "client reconnect that reattaches the SAME session with scrollback tail — never respawns"
execution_broker: "the only path for privileged actions: identity → policy → confirmation → execution → audit"
risk_gate: "broker's classification: informational|controlled|confirmed|restricted"
adapter_pin: "declared tool-version coverage an adapter was verified against; mismatch → 'unverified' badge"
fixture: "recorded PTY transcript (.cast/asciinema-style) used to write and regression-test adapters"
launch_profile: "saved per-tool launch config: working dir, flags, env, resume command"
session_registry: "the live index of sessions + states consumed by needs-you and alerts"
thick_wrapper: "the desktop edition model — Tauri shell + shared Go core as sidecar/library (not a URL in a window)"
gate_friendly: "operational model — runs stopped-by-default behind an admin toggle; no always-on requirement"
