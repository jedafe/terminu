---
id: k8s.pod.exec
application: kubectl
name: Shell into pod
description: Open an interactive shell in a pod
parameters:
  - name: pod
    type: resource
    resource: k8s.pod
    required: true
    flag: null
  - name: shell
    type: enum
    options: ["/bin/sh", "/bin/bash"]
    required: true
    flag: null
    default: "/bin/sh"
command:
  executable: kubectl
  arguments: [exec, -it, "{pod.id}", --, "{shell}"]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [kubectl]
  files: []
tags: [k8s, kubectl, exec, shell]
source: builtin
