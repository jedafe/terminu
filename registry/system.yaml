# Ref: .teos/conventions/adapter-manifest-format.md — system ops set.
id: sys.disk.usage
application: system
name: Disk usage
description: Filesystem usage by mount
command:
  executable: df
  arguments: ["-h"]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: []
  files: []
tags: [system, disk, df]
source: builtin
