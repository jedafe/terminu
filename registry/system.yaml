---
id: sys.systemctl.status
application: system
name: Service status
description: Show a systemd unit's status
parameters:
  - name: unit
    type: string
    required: true
    flag: null
    description: Unit name (e.g. nginx.service)
command:
  executable: systemctl
  arguments: [status, "{unit}", "--no-pager"]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [systemd]
  files: []
tags: [system, systemctl, status, service]
source: builtin
---
id: sys.systemctl.restart
application: system
name: Restart service
description: Restart a systemd unit
parameters:
  - name: unit
    type: string
    required: true
    flag: null
command:
  executable: systemctl
  arguments: [restart, "{unit}"]
execution:
  risk: confirmed
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [systemd]
  files: []
tags: [system, systemctl, restart, service]
source: builtin
