# Ref: .teos/conventions/adapter-manifest-format.md — node + bun set.
id: npm.install
application: npm
name: Install dependencies
description: Install package.json dependencies
command:
  executable: npm
  arguments: [install]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [npm, node]
  files: [package.json]
tags: [npm, install, deps]
source: builtin
---
id: npm.run
application: npm
name: Run script
description: Run a package.json script
parameters:
  - name: script
    type: string
    required: true
    flag: null
    description: Script name (dev, build, test…)
command:
  executable: npm
  arguments: [run, "{script}"]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [npm, node]
  files: [package.json]
tags: [npm, run, script]
source: builtin
---
id: npm.test
application: npm
name: Test
description: Run the test script
command:
  executable: npm
  arguments: [test]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [npm, node]
  files: [package.json]
tags: [npm, test]
source: builtin
---
id: npm.ls
application: npm
name: List dependencies
description: Show the installed dependency tree (top level)
command:
  executable: npm
  arguments: [ls, --depth=0]
execution:
  risk: informational
  confirmation: false
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [npm, node]
  files: [package.json]
tags: [npm, ls, deps]
source: builtin
---
id: bun.install
application: bun
name: Install dependencies
description: Install dependencies with bun
command:
  executable: bun
  arguments: [install]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [bun]
  files: [bun.lock, bun.lockb, package.json]
tags: [bun, install, deps]
source: builtin
