# Terminu — architecture principles & package map (Go per ADR-005)
principles:
  P1: sessions_not_windows        # unit of persistence = running session
  P2: session_is_server_side      # PTY owned by server; clients attach/detach
  P3: universal_detection_curated_depth   # every CLI: process+screen free; depth is adapters
  P4: ai_enhances_never_gates     # LLM opt-in; deterministic path always-on
  P5: security_is_substrate       # every privileged action through broker (ADR-004)
  P6: lightweight_by_budget       # <150MB idle, single container, SQLite
  P7: touch_is_first_class        # designed for phone, not adapted
shape: modular_monolith           # one server binary, package seams
layers:
  experience:   [sveltekit-ui, touch-chrome, overlay-buttons, keybar]
  application:  [session-manager, agent-session-manager, command-intelligence, file-service]
  control:      [execution-broker, policy, confirmation, audit]
  execution:    [pty-host, ssh-targets, docker-engine]
  integration:  [screen-interpreter, adapters, registry, storage-providers]
packages_planned:
  cmd/terminu-server:     main — wires everything
  internal/server:        http+ws wiring, auth middleware, routes
  internal/session:       lifecycle, PTY ownership, resync (goroutine per session)
  internal/screen:        headless VT model, dirty regions, trigger gate
  internal/adapter:       Adapter interface + per-tool impls + replay tests
  internal/registry:      command manifests, discovery, palette index
  internal/broker:        policy eval, risk gate, confirmations, audit
  internal/files:         storage providers (local/S3/SFTP)
  internal/conn:          SSH profiles, connection manager, credentials, SFTP-server plumbing
  internal/domain:        host-agnostic models — reused by desktop sidecar (ADR-002)
  internal/db:            sqlc generated + migration embed — NEVER hand-edit
# desktop host-adapter links domain+session+screen as a Go sidecar (ADR-002)
