---
id: git.branch.create
application: git
name: Create + switch branch
description: Create a branch and switch to it
parameters:
  - name: branch
    type: string
    required: true
    flag: null
    description: New branch name
command:
  executable: git
  arguments: [checkout, -b, "{branch}"]
execution:
  risk: controlled
  confirmation: true
  timeout_s: 0
  working_dir: "{session.cwd}"
context:
  processes: [git]
  files: [.git]
tags: [git, branch, create]
source: builtin
