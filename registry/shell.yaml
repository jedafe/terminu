# §04 — the shell cheat-sheet: surfaces when a session's foreground
# process IS the shell (zsh/bash/fish/sh at prompt). A pseudo-app —
# application "shell" groups them for ?application= + the apps modal.
# Display-only (informational); execution stays typed in the terminal.

id: shell.cmd.ls
application: shell
name: "ls"
description: "List directory contents — -la for detail + dotfiles"
command: { executable: "ls", arguments: [] }
execution: { risk: informational, confirmation: false, timeout_s: 0, working_dir: "{session.cwd}" }
context: { processes: [zsh, bash, fish, sh, dash, ksh], files: [] }
tags: [os, shell]
source: builtin
